<html>
  <head>
    <meta charset="utf-8" />
    <title>very simple paf site editor experiment</title>
    <style>

      * {
          box-sizing: border-box;
      }
      body {
          font-family: Helvetica, Arial, sans-serif;
      }

      #list, #view {
          position: absolute;
          top: 0;
          padding: 0;
          width: 50vw;
          height: 100vh;
          overflow-y: auto;
          overflow-x: hidden;
      }
      #list {
          left: 0;
          border-right: 1px solid black;
      }
      #view {
          right: 0;
      }

      #list .item {
          border-bottom: 1px solid #999;
          cursor: pointer;
          padding: 5px 10px;
      }
      #list .item:hover {
          background-color: yellow;
      }

      #list {
          position: absolute;
          top: 0;
          left: 0;
          padding: 0;
          height: 100vh;
          text-overflow-y: auto;
          text-overflow-x: hidden;
      }

      #view input.title {
          width: calc(100% - 20px);
          margin: 10px;
          font-size: 1.5rem;
      }

      #view textarea.md {
          width: calc(100% - 20px);
          margin: 10px;
          height: calc(100vh - 300px);
      }

      #toolbar {
          position: absolute;
          width: 300px;
          left: calc(50vw - 150px);
          bottom: 10px;
          height: 50px;
          background-color: black;
          color: white;
          padding: 10px;
      }

    </style>
  </head>
  <body>
    <div id="root">Loading...</div>

    <script>

      const T = {
          n_updates: 0
      };

      async function start() {
          console.log("Loading sitemap...!");
          T.sitemap = await (await fetch('/meta/sitemap.json')).json();

          const $root = document.getElementById("root");
          $root.textContent = "";

          T.$list = document.createElement("div");
          T.$list.id = "list";
          $root.appendChild(T.$list);

          T.$view = document.createElement("div");
          T.$view.id = "view";
          $root.appendChild(T.$view);

          T.$toolbar = document.createElement("div");
          T.$toolbar.id = "toolbar";
          $root.appendChild(T.$toolbar);


          render_sitemap();
          render_toolbar();
      }

      function render_sitemap() {
          T.$list.textContent = "";

          for(const [keyname, {title, md, date}] of Object.entries(T.sitemap)) {

              const $item = document.createElement("div");
              $item.className = "item";
              $item.textContent = `${keyname.split('.html')[0]} - ${title} - ${date || ''}`;
              $item.onclick = () => {
                  render_item(keyname);
              }
              T.$list.appendChild($item);
          }
      }

      function render_item(keyname) {
          T.$view.textContent = "";

          const {title, md, date} = T.sitemap[keyname];

          const $title = document.createElement("input");
          $title.className = "title";
          $title.value = title;
          T.$view.appendChild($title);

          const $date = document.createElement("div");
          $date.textContent = date || '';
          T.$view.appendChild($date);

          const $md = document.createElement("textarea");
          $md.className = "md";
          $md.textContent = md;
          T.$view.appendChild($md);

          const $cancel = document.createElement("button");
          $cancel.textContent = "cancel";
          $cancel.onclick = () => {
              T.$view.textContent = "";
          }
          T.$view.appendChild($cancel);

          const $set = document.createElement("button");
          $set.textContent = "set";
          $set.onclick = () => {
              T.sitemap[keyname].title = $title.value;
              T.sitemap[keyname].md = $md.value;

              T.n_updates += 1;

              T.$view.textContent = "";
              render_toolbar();
              render_sitemap();
          }
          T.$view.appendChild($set);

          const $delete = document.createElement("button");
          $delete.textContent = "delete";
          $delete.onclick = () => {
              delete T.sitemap[keyname];
              T.n_updates += 1;
              T.$view.textContent = "";
              render_sitemap();
              render_toolbar();
          }
          T.$view.appendChild($delete);


      }

      function render_toolbar() {
          T.$toolbar.textContent = `${T.n_updates} update(s) pending...`

          if(!T.n_updates) {
              return;
          }

          window.onbeforeunload = (event) => {
            event.preventDefault();
            event.returnValue = true;
          }

          const $publish = document.createElement("button");
          $publish.textContent = "publish version";
          T.$toolbar.appendChild($publish);
          $publish.onclick = () => {

              let versionName = prompt("Name for this version of the site");
              if(!versionName.trim()) {
                  alert("No version name provided - not publishing");
                  return;
              }

              versionName = encodeURI(versionName.trim().toLowerCase().replace(' ', '-'));
              console.log(`publishing to: "${versionName}"`);

              $publish.disabled = true;
              $publish.textContent = "Saving...";

              async function do_save() {

                  const res = await fetch('/edit/save_version', {
                      method: 'POST',
      headers: new Headers({'content-type': 'application/json'}),
                      body: JSON.stringify({
                          sitemap: T.sitemap,
                          version_name: versionName
                      })
                  });

                  if(res.status !== 200) {
                      alert("Error");
                      console.log(res);
                      return;
                  }

          window.onbeforeunload = null;

                  // ...and navigate to the new version!
                  window.location = `/version/${versionName}/`;

              }

              do_save();


          }

      }

      start();


    </script>

  </body>
</html>
