<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pa-f editor</title>
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <div id="login-pane" hidden>
    <form id="login-form">
      <h1>pa-f editor</h1>
      <label>Username <input type="text" name="username" autocomplete="username" required /></label>
      <label>Password <input type="password" name="password" autocomplete="current-password" required /></label>
      <button type="submit">Sign in</button>
      <div id="login-error" class="error"></div>
    </form>
  </div>

  <div id="app-pane" hidden>
    <header id="topbar">
      <span class="brand">pa-f editor</span>
      <span id="who"></span>
      <span class="grow"></span>
      <span id="status"></span>
      <button id="save-btn" disabled>Save</button>
      <button id="logout-btn">Sign out</button>
    </header>

    <div id="workspace">
      <aside id="sidebar">
        <div class="sidebar-header">
          <input id="page-filter" type="search" placeholder="Filter pages…" />
          <button id="new-page-btn" type="button" title="Create a new page">+ New page</button>
        </div>
        <ul id="page-list"></ul>
      </aside>

      <main id="editor-area">
        <div id="placeholder">Select a page on the left to begin editing, or click <em>+ New page</em>.</div>
        <div id="page-editor" hidden>
          <div class="meta-grid">
            <label class="meta-field span2">
              <span>Title</span>
              <input id="page-title" type="text" />
            </label>
            <label class="meta-field">
              <span>Date</span>
              <input id="page-date" type="text" placeholder="YYYY-MM-DD" />
            </label>
            <label class="meta-field span2">
              <span>URL / path <em class="hint">(e.g. events/my-page.html)</em></span>
              <input id="page-path" type="text" spellcheck="false" />
              <span class="field-error" id="path-error"></span>
            </label>
            <label class="meta-field">
              <span>Hero image URL</span>
              <input id="page-image" type="text" spellcheck="false" placeholder="/sites/pa-f.net/files/…" />
            </label>
            <button id="delete-page-btn" type="button" class="danger" title="Delete this page">Delete page</button>
          </div>
          <div id="quill-toolbar">
            <span class="ql-formats">
              <select class="ql-header">
                <option selected></option>
                <option value="2"></option>
                <option value="3"></option>
              </select>
            </span>
            <span class="ql-formats">
              <button class="ql-bold"></button>
              <button class="ql-italic"></button>
              <button class="ql-link"></button>
            </span>
            <span class="ql-formats">
              <button class="ql-list" value="ordered"></button>
              <button class="ql-list" value="bullet"></button>
              <button class="ql-blockquote"></button>
            </span>
            <span class="ql-formats">
              <button class="ql-image" title="Insert image"></button>
              <button class="ql-clean"></button>
            </span>
          </div>
          <div id="quill-editor"></div>
        </div>
      </main>
    </div>

    <div id="toast"></div>
  </div>
</body>
</html>
