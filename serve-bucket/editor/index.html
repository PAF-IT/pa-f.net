<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pa-f editor</title>
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <div id="denied-pane" hidden>
    <div>
      <h1>pa-f editor</h1>
      <p>You don't have editor access.</p>
    </div>
  </div>

  <div id="app-pane" hidden>
    <header id="topbar">
      <span class="brand">pa-f editor</span>
      <span id="who"></span>
      <span class="grow"></span>
      <span id="status"></span>
      <button id="save-btn" disabled>Save</button>
    </header>

    <div id="workspace">
      <aside id="sidebar">
        <div class="sidebar-header">
          <input id="page-filter" type="search" placeholder="Filter pages…" />
          <button id="new-page-btn" type="button" title="Create a new page">+ New page</button>
        </div>
        <ul id="page-list"></ul>
      </aside>

      <main id="editor-area">
        <div id="placeholder">Select a page on the left to begin editing, or click <em>+ New page</em>.</div>
        <div id="page-editor" hidden>
          <div id="quill-toolbar">
            <span class="ql-formats">
              <select class="ql-header">
                <option selected></option>
                <option value="2"></option>
                <option value="3"></option>
              </select>
            </span>
            <span class="ql-formats">
              <button class="ql-bold"></button>
              <button class="ql-italic"></button>
              <button class="ql-link"></button>
            </span>
            <span class="ql-formats">
              <button class="ql-list" value="ordered"></button>
              <button class="ql-list" value="bullet"></button>
              <button class="ql-blockquote"></button>
            </span>
            <span class="ql-formats">
              <button class="ql-image" title="Insert image"></button>
              <button class="ql-attach" title="Attach file">
                <svg viewBox="0 0 18 18" width="18" height="18">
                  <path class="ql-stroke" fill="none" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round"
                        d="M12 6.5 6.7 11.8a2 2 0 0 0 2.8 2.8l5.3-5.3a3.5 3.5 0 0 0-5-5L4.5 9.6a5 5 0 0 0 7 7l4.5-4.5"/>
                </svg>
              </button>
              <button class="ql-clean"></button>
            </span>
          </div>
          <div id="quill-editor"></div>
        </div>
      </main>

      <aside id="meta-pane">
        <button id="meta-toggle" type="button" title="Toggle meta panel">›</button>
        <div class="meta-pane-body">
          <label class="meta-field">
            <span>Title</span>
            <input id="page-title" type="text" />
          </label>
          <label class="meta-field">
            <span>Date</span>
            <input id="page-date" type="text" placeholder="YYYY-MM-DD" />
          </label>
          <label class="meta-field">
            <span>URL / path</span>
            <input id="page-path" type="text" spellcheck="false" placeholder="events/my-page" />
            <span class="field-error" id="path-error"></span>
          </label>
          <div class="meta-field">
            <span>Hero image</span>
            <div id="hero-controls">
              <img id="hero-thumb" alt="" hidden />
              <button id="hero-upload-btn" type="button">Upload hero image…</button>
              <button id="hero-clear-btn" type="button" class="link" hidden>Clear</button>
            </div>
          </div>
          <button id="delete-page-btn" type="button" class="danger">Delete page</button>
        </div>
      </aside>
    </div>

    <div id="toast"></div>

    <div id="image-modal" class="modal" hidden>
      <div class="modal-backdrop" data-close="1"></div>
      <div class="modal-card">
        <h3>Edit image</h3>
        <img id="image-modal-preview" alt="" />
        <label class="meta-field">
          <span>Caption <em class="hint">(italic line below image; leave empty for none)</em></span>
          <input id="image-modal-caption" type="text" />
        </label>
        <div class="modal-actions">
          <button id="image-modal-replace" type="button">Replace image…</button>
          <button id="image-modal-remove" type="button" class="danger">Remove</button>
          <span class="grow"></span>
          <button id="image-modal-cancel" type="button">Cancel</button>
          <button id="image-modal-save" type="button" class="primary">Save</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
