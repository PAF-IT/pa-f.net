[project]
name = "paf-serve-bucket"
version = "0.2.0"
description = "FastAPI bucket proxy + WYSIWYG editor for pa-f.net"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "boto3>=1.35",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.2",
    "python-multipart>=0.0.12",
    "pillow>=11.0",
    "markdownify>=0.13",
    "markdown>=3.7",
]

# palimpsest is imported via the local ./palimpsest symlink (->../palimpsest); not a packaged dep.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
